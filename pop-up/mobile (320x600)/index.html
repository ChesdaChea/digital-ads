<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="ad.size" content="width=360,height=640">
  <title>HTML5 Ad</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    #ad-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #ad-lottie {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
    }
  </style>

  <script>
    var clickTag = "https://www.facebook.com/AngkorBeerOfficial";
  </script>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <script>
    if (!window.customElements || !window.customElements.get('lottie-player')) {
      var fallback = document.createElement('script');
      fallback.src = './player.js';
      document.head.appendChild(fallback);
    }
  </script>
</head>

<body>
  <div id="ad-container" role="link" aria-label="Open advertisement" tabindex="0">
    <lottie-player
      id="ad-lottie"
      src="./option4.json"
      background="transparent"
      speed="1"
      autoplay
      aria-hidden="true">
    </lottie-player>
  </div>

  <script>
    (function () {
      'use strict';

      var ad = document.getElementById('ad-container');

      function openLandingPage() {
        window.open(window.clickTag, '_blank', 'noopener,noreferrer');
      }

      ad.addEventListener('click', openLandingPage);

      ad.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLandingPage();
        }
      });


      var lottie = document.getElementById('ad-lottie');
      var readySent = false;

      function notifyParentReady() {
        if (readySent) return;
        readySent = true;

        window.parent.postMessage(
          { type: 'MSA_AD_READY' },
          '*'
        );
      }

      if (lottie) {
        lottie.addEventListener('ready', notifyParentReady, { once: true });
        lottie.addEventListener('load', notifyParentReady, { once: true });
      }
    })();
  </script>
</body>
</html>
