<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src='./gsap.min.js'></script>
</head>

<body>
    <div id="thestreet-content-banner">
        <div id="content-animation" class="thestreet-popup-wrapper">
            <div class="thestreet-popup-container">
                <div id="background"></div>
                <div class="box_money">
                    <img id="money" src="./images/Money.png" alt="">
                </div>
                <div id="cans_3"><img id="cans" src="./images/Sting.png" alt=""></div>
                <div class="text_winner">
                    <img id="winner_stroke" src="./images/1000 Stroke (2).png" alt="">
                </div>
                <div class="text_winner">
                    <img id="winner" src="./images/1000 (2).png" alt="">
                </div>
                <div class="text_under">
                    <img src="./images/Text.png" alt="">
                </div>
                <a id="external-link" target="_blank"
                    style="position:absolute; width: 100%; height: 100%; top: 0; left: 0;"></a>
            </div>
            <div class="thestreet-close-wrapper">
                <div id="timeleft"></div>
                <div id="thestreet-close-ads">
                    <div id="thestreet-close-img">
                        <img src="./images/closeButton.png" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./app.js"></script>

</body>
</html>
