<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="ad.size" content="width=360,height=640">
  <title>HTML5 Ad</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    #ad-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #ad-lottie {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
    }

    #close-button {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 28px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      padding: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    #close-button:hover,
    #close-button:focus {
      background: rgba(0, 0, 0, 0.9);
      outline: none;
    }
  </style>

  <script>
    var clickTag = "https://www.facebook.com/AngkorBeerOfficial";
  </script>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <script>
    if (!window.customElements || !window.customElements.get('lottie-player')) {
      var fallback = document.createElement('script');
      fallback.src = './player.js';
      document.head.appendChild(fallback);
    }
  </script>
</head>

<body>
  <div id="ad-container" role="link" aria-label="Open advertisement" tabindex="0">
    <button id="close-button" type="button" aria-label="Close advertisement">×</button>

    <!-- <lottie-player
      id="ad-lottie"
      src="./data.json"
      background="transparent"
      speed="1"
      autoplay
      aria-hidden="true">
    </lottie-player> -->

    <video width="320px" height="600px" id="ad-lottie" autoplay muted playsinline loop style="position: relative; z-index: 1;">
      <source src="./images/Comp 1.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    (function () {
      'use strict';

      var ad = document.getElementById('ad-container');
      var closeButton = document.getElementById('close-button');

      function closeAd() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'AD_CLOSE' }, '*');
        }

        if (ad) {
          ad.style.display = 'none';
        }
      }

      function openLandingPage() {
        window.open(window.clickTag, '_blank', 'noopener,noreferrer');
      }

      ad.addEventListener('click', function (event) {
        if (event.target === closeButton) {
          return;
        }

        openLandingPage();
      });

      ad.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLandingPage();
        }
      });

      if (closeButton) {
        closeButton.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          closeAd();
        });

        closeButton.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            event.stopPropagation();
            closeAd();
          }
        });
      }

      var lottie = document.getElementById('ad-lottie');
      var readySent = false;

      function notifyParentReady() {
        if (readySent) return;
        readySent = true;

        window.parent.postMessage(
          { type: 'MSA_AD_READY' },
          '*'
        );
      }

      if (lottie) {
        lottie.addEventListener('ready', notifyParentReady, { once: true });
        lottie.addEventListener('load', notifyParentReady, { once: true });
      }
    })();
  </script>
</body>
</html>
